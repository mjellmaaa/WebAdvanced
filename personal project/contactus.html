<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT US</title>

    <style>
        body {
            margin: 0;
            font-family: "Trebuchet MS", Helvetica, sans-serif;

            background: linear-gradient(
                rgba(0,0,0,0.4),
                rgba(0,0,0,0.4)
            ),
            url("images/aboutus.png");

            background-size: cover;
            background-position: center;
        }


        .contact {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 60px 20px;
        }

        .contact-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.25);
        }

        .contact h1 {
            font-size: 38px;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 20px;
        }

     
        .intro {
            font-size: 18px;
            color: #444;
            margin-bottom: 30px;
        }

    
        .divider {
            width: 50px;
            height: 3px;
            background: #545454;
            margin: 20px auto;
            border-radius: 5px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            background: #545454;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #545454;
            transform: scale(1.05);
        }

  
        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

<section class="contact">
    <div class="contact-container">

        <div class="subtitle">GET IN TOUCH</div>
        <h1>Contact Us</h1>

        <div class="divider"></div>

        <p class="intro">
            Have questions or dupe suggestions? We'd love to hear from you!
        </p>

        <div class="contact-info">
            <a href="mailto:info@shkolladigjitale.com" class="btn">Send Email</a>
            <a href="tel:+3831234567" class="btn">Call Us</a>
        </div>

        <div class="footer-text">
            We usually respond within 24 hours 💌
        </div>

    </div>
</section>

</body>
</html>

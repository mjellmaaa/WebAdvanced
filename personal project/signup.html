<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT US</title>
</head>
<body>
    <section id="section-3">
        <div class="container">
            <div class="title-box">
                <h2 style="text-align: center; font-size: 40px;">GET IN TOUCH</h2>
                <div class="line"></div>
                <p style="text-align: center; font-size: 25px;">Create an account to discover the best
                     beauty dupes, save your favorites, and stay updated on new affordable finds.</p>
            </div>
            <div id="contact-form">
                <form>
                    <div class="form-row">
                        <input type="text" name="name" placeholder="your name">
                        <input type="email" name="email" placeholder="your email">
                    </div>
                    <div class="form-row">
                        <textarea name="message" placeholder="your message"></textarea>
                    </div>
                    <div class="form-row">
                        <input type="submit" class="big-button" value="send message">
                    </div>
                </form>
            </div>
        </div>
    </section>
    <style>
        #section-3{
            background-color: #646466;
             min-height: 1000px ;
            color: white;
           font-family: "Trebuchet MS", Helvetica, sans-serif;
           margin-top: auto;
           padding-top: auto;
        }

        #contact-form{
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-row{
            display: flex;
        }

        input[type="text"], input[type="email"]{
            width: 46%;
            height: 56px;
        }

        input[type="text"], input[type="email"], textarea{
            font-family:"Trebuchet MS", Helvetica, sans-serif;;
            color: white;
            background-color: #b6b6b6;
            border: none;
            font-size: 18px;
            margin: 16px;
            border-radius: 5px;
            padding-left: 26px;
        }

        textarea{
            height: 200px;
            width: 100%;
            padding-top: 24px;
        }

        input[type="submit"]{
            background-color: #cccccc;
            border: none;
            font-size: 18px;
            text-transform: uppercase;
            margin-left: auto;
            margin-right: auto;
            border-radius: 5px;
            margin-top: 60px;
        }

        .big-button{
            padding: 25px 85px;
            color: white;
        }

    </style>

</body>
</html>
